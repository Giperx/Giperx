name: Generate Profile Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          mkdir -p profile
          mkdir -p .tmp

      - name: Fetch light stats
        run: |
          if curl -fsSL --retry 5 --retry-delay 3 --max-time 30 \
            "https://github-readme-stats.vercel.app/api?username=Giperx&show_icons=true&hide_border=true&theme=default&cache_seconds=21600" \
            -o .tmp/stats-light.svg; then
            echo "Fetched light stats from remote service."
          else
            echo "Remote light stats unavailable, using local fallback."
            test -s profile/stats-light.svg
            cp profile/stats-light.svg .tmp/stats-light.svg
          fi

      - name: Fetch dark stats
        run: |
          if curl -fsSL --retry 5 --retry-delay 3 --max-time 30 \
            "https://github-readme-stats.vercel.app/api?username=Giperx&show_icons=true&hide_border=true&theme=github_dark&cache_seconds=21600" \
            -o .tmp/stats-dark.svg; then
            echo "Fetched dark stats from remote service."
          else
            echo "Remote dark stats unavailable, using local fallback."
            test -s profile/stats-dark.svg
            cp profile/stats-dark.svg .tmp/stats-dark.svg
          fi

      - name: Validate SVGs
        run: |
          test -s .tmp/stats-light.svg
          test -s .tmp/stats-dark.svg
          grep -qi "<svg" .tmp/stats-light.svg
          grep -qi "<svg" .tmp/stats-dark.svg
          ! grep -qi "Something went wrong" .tmp/stats-light.svg
          ! grep -qi "Something went wrong" .tmp/stats-dark.svg

      - name: Publish files
        run: |
          cp .tmp/stats-light.svg profile/stats-light.svg
          cp .tmp/stats-dark.svg profile/stats-dark.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-light.svg profile/stats-dark.svg
          git commit -m "chore(profile): update stats svg" || echo "No changes"
          git push
