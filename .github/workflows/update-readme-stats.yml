name: Generate Profile Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      STATS_API_BASE_URL: ${{ vars.README_STATS_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          mkdir -p profile
          mkdir -p .tmp

      - name: Resolve stats endpoint
        run: |
          if [ -z "$STATS_API_BASE_URL" ]; then
            echo "::warning::README_STATS_API_BASE_URL is not set; fallback to public endpoint."
            echo "STATS_API_BASE_URL=https://github-readme-stats.vercel.app" >> "$GITHUB_ENV"
          else
            echo "Using self-hosted endpoint: $STATS_API_BASE_URL"
          fi

      - name: Fetch light stats
        run: |
          if curl -fsSL --retry 5 --retry-delay 3 --max-time 30 \
            "${STATS_API_BASE_URL}/api?username=Giperx&show_icons=true&hide_border=true&theme=default&cache_seconds=21600" \
            -o .tmp/stats-light.svg; then
            echo "Fetched light stats from remote service."
          else
            echo "Remote light stats unavailable, using local fallback."
            if [ -s profile/stats-light.svg ] && grep -qi "<svg" profile/stats-light.svg && ! grep -qi "Something went wrong" profile/stats-light.svg; then
              cp profile/stats-light.svg .tmp/stats-light.svg
            else
              cat > .tmp/stats-light.svg <<'SVG'
              <svg xmlns="http://www.w3.org/2000/svg" width="495" height="120" viewBox="0 0 495 120"><rect width="495" height="120" fill="#ffffff"/><text x="20" y="58" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="16" fill="#24292f">GitHub stats temporarily unavailable</text></svg>
              SVG
            fi
          fi

      - name: Fetch dark stats
        run: |
          if curl -fsSL --retry 5 --retry-delay 3 --max-time 30 \
            "${STATS_API_BASE_URL}/api?username=Giperx&show_icons=true&hide_border=true&theme=github_dark&cache_seconds=21600" \
            -o .tmp/stats-dark.svg; then
            echo "Fetched dark stats from remote service."
          else
            echo "Remote dark stats unavailable, using local fallback."
            if [ -s profile/stats-dark.svg ] && grep -qi "<svg" profile/stats-dark.svg && ! grep -qi "Something went wrong" profile/stats-dark.svg; then
              cp profile/stats-dark.svg .tmp/stats-dark.svg
            else
              cat > .tmp/stats-dark.svg <<'SVG'
              <svg xmlns="http://www.w3.org/2000/svg" width="495" height="120" viewBox="0 0 495 120"><rect width="495" height="120" fill="#0d1117"/><text x="20" y="58" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="16" fill="#c9d1d9">GitHub stats temporarily unavailable</text></svg>
              SVG
            fi
          fi

      - name: Validate SVGs
        run: |
          test -s .tmp/stats-light.svg
          test -s .tmp/stats-dark.svg
          grep -qi "<svg" .tmp/stats-light.svg
          grep -qi "<svg" .tmp/stats-dark.svg
          ! grep -qi "Something went wrong" .tmp/stats-light.svg
          ! grep -qi "Something went wrong" .tmp/stats-dark.svg

      - name: Publish files
        run: |
          cp .tmp/stats-light.svg profile/stats-light.svg
          cp .tmp/stats-dark.svg profile/stats-dark.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-light.svg profile/stats-dark.svg
          git commit -m "chore(profile): update stats svg" || echo "No changes"
          git push
